name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: pcap-agent
            asset: pcap-agent-linux.tar.gz
            goos: linux
            goarch: amd64
          - os: windows-latest
            binary: pcap-agent.exe
            asset: pcap-agent-windows.zip
            goos: windows
            goarch: amd64
          - os: macos-latest
            binary: pcap-agent
            asset: pcap-agent-macos-intel.tar.gz
            goos: darwin
            goarch: amd64
          - os: macos-latest
            binary: pcap-agent
            asset: pcap-agent-macos-apple-silicon.tar.gz
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install libpcap (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libpcap-dev

      - name: Install libpcap (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libpcap

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o ${{ matrix.binary }} ./cmd/agent

      - name: Package Windows binary
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.binary }}' -DestinationPath '${{ matrix.asset }}'

      - name: Package Unix binary
        if: matrix.goos != 'windows'
        run: tar -czf '${{ matrix.asset }}' '${{ matrix.binary }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pcap-agent-windows.zip
            pcap-agent-linux.tar.gz
            pcap-agent-macos-intel.tar.gz
            pcap-agent-macos-apple-silicon.tar.gz
          generate_release_notes: true

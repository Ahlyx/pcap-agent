name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: pcap-agent
            asset: pcap-agent-linux.tar.gz
            goos: linux
            goarch: amd64
          - os: windows-latest
            binary: pcap-agent.exe
            asset: pcap-agent-windows.zip
            goos: windows
            goarch: amd64
          - os: macos-latest
            binary: pcap-agent
            asset: pcap-agent-macos-intel.tar.gz
            goos: darwin
            goarch: amd64
          - os: macos-latest
            binary: pcap-agent
            asset: pcap-agent-macos-apple-silicon.tar.gz
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.22'

      - name: Install libpcap (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libpcap-dev

      - name: Install libpcap (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libpcap

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o ${{ matrix.binary }} ./cmd/agent

      - name: Package Windows binary
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.binary }}' -DestinationPath '${{ matrix.asset }}'

      - name: Package Unix binary
        if: matrix.goos != 'windows'
        run: tar -czf '${{ matrix.asset }}' '${{ matrix.binary }}'

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: ${{ matrix.asset }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Create checksum manifest
        run: sha256sum pcap-agent-windows.zip pcap-agent-linux.tar.gz pcap-agent-macos-intel.tar.gz pcap-agent-macos-apple-silicon.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            pcap-agent-windows.zip
            pcap-agent-linux.tar.gz
            pcap-agent-macos-intel.tar.gz
            pcap-agent-macos-apple-silicon.tar.gz
            SHA256SUMS
          generate_release_notes: true
